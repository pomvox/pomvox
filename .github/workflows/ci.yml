name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-spec:
    name: Python spec suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The pure-logic modules (config, hotkey/hud/vad state machines, bench,
      # history, onboarding, cleanup prompts/guards) are platform-independent and
      # are the cross-checked spec the Swift ports are verified against. The
      # macOS-only deps (mlx, parakeet-mlx, pyobjc, ...) are gated behind
      # sys_platform markers, so they aren't installed here and the suite runs on
      # Linux. The native Swift app is exercised by the swift-tests job below.
      - name: Run the Python spec suite
        run: uv run --frozen pytest -q

  swift-tests:
    name: Swift tests (macOS)
    # macos-15 ships Xcode >= 16.3 (Swift 6.1), required by swift-tokenizers-mlx's
    # tools version; macos-14's newest stable Xcode is too old to resolve it.
    # 90 min: shared runners intermittently take >6x the healthy ~7 min build
    # (observed 2026-07-07, 3 consecutive 40-min timeouts mid-dependency-compile).
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Pinned, not latest-stable. An Xcode after 26.3 fails the build with
      # "Multiple commands produce .../Debug/include/module.modulemap": the
      # Pomvox and PomvoxTests targets each run ProcessXCFramework for
      # swift-tokenizers' TokenizersRust.xcframework, and the newer toolchain
      # rejects the duplicate output that older ones tolerated. Nothing in this
      # repo changed — main simply went 15 days without a CI run (last green
      # 2026-08-10) while the runner's latest-stable moved underneath it, so
      # the first PR after that gap ate the breakage. 26.3 is the toolchain the
      # v0.2.5 release was built and notarized with. Unpin once the duplicate
      # xcframework copy is fixed properly (tracked in the CI-health issue).
      - name: Select the pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Print toolchain
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate the Xcode project
        working-directory: Pomvox
        run: xcodegen generate

      # FluidAudio and swift-tokenizers are both held below a specific version
      # for reasons nothing in the app's sources expresses; assert the pins
      # survived rather than discovering a loosened one as an unrelated-looking
      # build failure. See scripts/check-package-pins.sh.
      - name: Check package pins survived generation
        run: ./scripts/check-package-pins.sh

      # Cache the resolved Swift packages (mlx-swift, swift-syntax, FluidAudio, …)
      # keyed on the committed Package.resolved — the first build is the slow one.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Pomvox/Pomvox.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Unit tests are pure logic, but the test host links the full app (FluidAudio
      # + mlx-swift), so the build is heavy. The CI runner has no code-signing
      # identity ("Murmur Dev" is a local self-signed cert), so signing is disabled
      # — the unit tests don't exercise entitlement-gated paths (mic/TCC/hotkey).
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pomvox/Pomvox.xcodeproj \
            -scheme Pomvox \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee raw-build.log | xcbeautify --renderer github-actions || exit 1

      # xcbeautify collapses the build system's "Multiple commands produce X"
      # detail, and those are the only lines naming BOTH conflicting producers
      # — without them a build-graph failure is diagnosable only by guesswork.
      - name: Show raw build-graph errors
        if: failure()
        run: |
          grep -n -A25 "Multiple commands produce" raw-build.log || \
            echo "no 'Multiple commands produce' in raw log"

      - name: Upload raw build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-build-log
          path: raw-build.log
          if-no-files-found: ignore

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
