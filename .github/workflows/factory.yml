# Drop this file into .github/workflows/factory.yml of each portfolio repo.
# It only routes events to the reusable workflows in pomvox/pomvox_loop.
# Needs org secrets CLAUDE_CODE_OAUTH_TOKEN and FACTORY_GH_TOKEN, and pomvox_loop's
# Actions access set to "organization" so this private reusable workflow can be called.
name: Factory
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  research-pm:
    if: github.event_name == 'issues' && contains(fromJSON('["proposal","loop-suggested","agent-suggested"]'), github.event.label.name)
    uses: pomvox/pomvox_loop/.github/workflows/agent.yml@main
    with:
      role: research-pm
      issue: ${{ github.event.issue.number }}
    secrets: inherit

  triage:
    if: github.event_name == 'issues' && github.event.label.name == 'agent-ready' && !contains(github.event.issue.labels.*.name, 'retry')
    uses: pomvox/pomvox_loop/.github/workflows/agent.yml@main
    with:
      role: triage
      issue: ${{ github.event.issue.number }}
    secrets: inherit

  approve:
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
    uses: pomvox/pomvox_loop/.github/workflows/conveyor.yml@main
    with:
      step: approve
      issue: ${{ github.event.issue.number }}
      comment_body: ${{ github.event.comment.body }}
      actor_association: ${{ github.event.comment.author_association }}
    secrets: inherit

  disarm:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'agent-loop')
    uses: pomvox/pomvox_loop/.github/workflows/conveyor.yml@main
    with:
      step: disarm
      pr: ${{ github.event.pull_request.number }}
    secrets: inherit

  evaluator:
    needs: [disarm]
    if: >-
      !cancelled() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'agent-loop') &&
      (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'agent-loop'))
    uses: pomvox/pomvox_loop/.github/workflows/agent.yml@main
    with:
      role: evaluator
      pr: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.sha }}
      base: ${{ github.event.pull_request.base.ref }}
    secrets: inherit

  security:
    needs: [disarm]
    if: >-
      !cancelled() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'agent-loop') &&
      (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'agent-loop'))
    uses: pomvox/pomvox_loop/.github/workflows/agent.yml@main
    with:
      role: security
      pr: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.sha }}
      base: ${{ github.event.pull_request.base.ref }}
    secrets: inherit

  ready:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'eval-pass' || github.event.label.name == 'sec-pass')
    uses: pomvox/pomvox_loop/.github/workflows/conveyor.yml@main
    with:
      step: ready
      pr: ${{ github.event.pull_request.number }}
    secrets: inherit

  steward:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'agent-loop')
    uses: pomvox/pomvox_loop/.github/workflows/agent.yml@main
    with:
      role: steward
      pr: ${{ github.event.pull_request.number }}
    secrets: inherit
