# Drop this file into .github/workflows/factory.yml of each portfolio repo.
# It is a relay and nothing else: it forwards issue and PR events to the private
# factory repo (pomvox/pomvox_loop), where every agent runs. GitHub does not let a
# public repo call reusable workflows in a private one, so the work cannot run here.
# Needs one repo secret: FACTORY_GH_TOKEN (a token that can dispatch to pomvox_loop).
name: Factory
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Forward the event to pomvox_loop
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          payload=$(jq -c '{
            repo: .repository.full_name,
            event: env.GITHUB_EVENT_NAME,
            action: .action,
            label: (.label.name // ""),
            issue: (if .issue then {number: .issue.number, labels: [.issue.labels[].name], is_pr: (.issue.pull_request != null)} else null end),
            comment: (if .comment then {body: .comment.body[0:1000], association: .comment.author_association} else null end),
            pr: (if .pull_request then {number: .pull_request.number, head_sha: .pull_request.head.sha, base: .pull_request.base.ref, labels: [.pull_request.labels[].name], merged: (.pull_request.merged // false)} else null end)
          }' "$GITHUB_EVENT_PATH")
          # Forward only what the factory listens for. Everything else stays quiet.
          want=$(printf '%s' "$payload" | jq -r '. as $e |
            if $e.event == "issues" then (["proposal","loop-suggested","agent-suggested","agent-ready"] | index($e.label)) != null
            elif $e.event == "issue_comment" then ($e.issue.is_pr | not) and (($e.issue.labels | map(select(. == "proposal" or . == "loop-suggested" or . == "agent-suggested" or . == "needs-human" or . == "agent-ready")) | length) > 0)
            elif $e.event == "pull_request" then (($e.pr.labels | index("agent-loop")) != null) or ((["agent-loop","eval-pass","sec-pass"] | index($e.label)) != null)
            else false end')
          if [ "$want" != "true" ]; then echo "not a factory event; nothing forwarded"; exit 0; fi
          jq -n --argjson p "$payload" '{event_type: "factory", client_payload: $p}' \
            | gh api -X POST repos/pomvox/pomvox_loop/dispatches --input -
          echo "forwarded: $(printf '%s' "$payload" | jq -c '{event, action, label, issue: .issue.number, pr: .pr.number}')"
